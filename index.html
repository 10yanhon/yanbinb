<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>紫色伪装页面</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #a56bff, #6a1b9a);
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .box {
            max-width: 700px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.4rem;
            line-height: 1.8rem;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>紫色云端</h1>
        <p>在紫色的云端，我写下属于自己的诗</p>
    </div>
</body>
</html>
