<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紫色云端 · 个性化主题页</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f8f3ff, #ece0ff);
            color: #3a2a4f;
        }

        header {
            text-align: center;
            padding: 120px 20px;
            background: linear-gradient(135deg, #9c4dcc, #7c3aed, #c084fc);
            color: white;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 0 4px 30px rgba(255,255,255,0.35);
        }

        header p {
            font-size: 1.3rem;
            opacity: 0.95;
        }

        section {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .card {
            background: rgba(255,255,255,0.45);
            backdrop-filter: blur(14px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.15);
            font-size: 1.2rem;
            line-height: 1.8;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            background: #4a148c;
            color: white;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>

    <header>
        <h1>在紫色的云端，我写下属于自己的诗</h1>
        <p>轻柔的风带来希望，光穿过云隙落在你身上。</p>
    </header>

    <section>
        <div class="card">
            在浅浅的紫色天光下，世界变得安静、柔软、温柔起来。
            每一步落在地面上，都像在云端上轻轻印下一笔。
        </div>

        <div class="card">
            如果你愿意停下来听一听，你会听到风穿过山谷的声音，
            也会听到自己的心跳——那么清晰，那么真实。
        </div>

        <div class="card">
            这不仅是一页网页，而是一段属于你的时光。
            它可以是一首诗，也可以是一幅风景。
            你看到什么，它便是什么。
        </div>
    </section>

    <footer>
        ✦ Purple Theme © 2025 · 个性化主题页 ✦
    </footer>

</body>
</html>
