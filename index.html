<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>在紫色的云端</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --primary: #9b5bff;
      --primary-600: #874ae8;
      --accent: #c49bff;
      --bg: #f6f1ff;
      --glass: rgba(255,255,255,0.15);
      --glass-border: rgba(255,255,255,0.22);
      --text: #2b2240;
      --shadow: 0 12px 32px rgba(110,48,200,0.18);
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:linear-gradient(180deg,#f5edff,#efe4ff 55%,#e7dcff);
      font-family:"Inter","Segoe UI",sans-serif;
      color:var(--text);
    }

    header{
      padding:18px 0;
      background:linear-gradient(90deg,var(--primary),var(--accent));
      color:white;
      text-align:center;
      font-size:1.6rem;
      font-weight:800;
      letter-spacing:.05em;
      text-shadow:0 4px 14px rgba(70,0,150,0.25);
    }

    /* HERO */
    .hero{
      position:relative;
      padding:90px 20px 120px;
      text-align:center;
      overflow:hidden;
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=60')
        center/cover no-repeat;
      filter:brightness(.55) blur(2px);
      z-index:-2;
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg,rgba(155,91,255,0.45),rgba(196,155,255,0.28));
      mix-blend-mode:screen;
      z-index:-1;
    }

    .hero-card{
      display:inline-block;
      max-width:900px;
      background:var(--glass);
      backdrop-filter:blur(10px);
      border:1px solid var(--glass-border);
      padding:42px 28px;
      border-radius:20px;
      box-shadow:var(--shadow);
      color:white;
    }

    .hero h1{
      font-size:clamp(2rem,4.4vw,3.6rem);
      margin-bottom:14px;
      font-weight:900;
      text-shadow:0 10px 30px rgba(60,0,140,0.35);
    }

    .hero p{
      font-size:clamp(1.05rem,1.6vw,1.35rem);
      opacity:.95;
      line-height:1.6;
      margin:0 auto;
      max-width:720px;
    }

    footer{
      padding:40px 0;
      text-align:center;
      color:#fff;
      background:linear-gradient(180deg,#4b0e82,#2c0650);
      font-size:.9rem;
      opacity:.9;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    在紫色的云端
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-card">
      <h1>在紫色的云端</h1>
      <p>在风与云的交汇处，我把心事写成一束温柔的光。</p>
    </div>
  </section>

  <footer>
    © 2025 Purple Cloud. All rights reserved.
  </footer>

</body>
</html>
